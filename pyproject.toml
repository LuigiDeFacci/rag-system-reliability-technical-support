[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-confidence-tcc"
version = "0.1.0"
description = "Calibrated evidence-sufficiency estimation for technical-support RAG"
readme = "README.md"
requires-python = ">=3.10,<3.13"
authors = [{ name = "Luigi De Facci" }]
dependencies = [
  "numpy",
  "pandas",
  "pyarrow",
  "PyYAML",
  "scikit-learn",
  "scipy",
  "truststore>=0.10; sys_platform == 'win32'",
]

[project.optional-dependencies]
retrieval = ["sentence-transformers>=3.0,<6"]
notebooks = ["jupyterlab", "matplotlib", "seaborn"]
dev = ["pytest", "ruff"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
