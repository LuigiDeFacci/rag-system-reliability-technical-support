    - semantic_topk_mean_zscore
    - semantic_topk_std_zscore
    - rrf_top1_score_raw
    - rrf_margin_top1_top2_raw
    - rrf_topk_mean_raw
    - rrf_topk_std_raw
    - lex_sem_top1_document_agreement
    - lex_sem_topk_chunk_jaccard
    - lex_sem_topk_document_jaccard
    - hybrid_lex_topk_chunk_jaccard
    - hybrid_sem_topk_chunk_jaccard
    - lex_sem_full_rank_correlation
    - query_length_technical_tokens
    - query_version_pattern_count
    - query_code_pattern_count
    - hybrid_context_unique_documents
logistic_regression:
  C: 1.0
  class_weight: null
  max_iter: 2000
  solver: lbfgs
metrics:
  retrieval: [recall_at_k, mrr, ndcg_at_k]
  classification: [precision, recall, f1, roc_auc, pr_auc]
  calibration: [brier, ece]
  selective: [coverage, selective_risk, aurc]
bootstrap:
  grouped_by: query_id
  paired: true
  replicates: 2000
  confidence_level: 0.95
prevalence_sensitivity:
  target_positive_rates: [0.20, 0.40, 0.60, 0.80]
  method: analytic_class_reweighting
  refit_or_recalibrate: false
internal_selection:
